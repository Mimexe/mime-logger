name: Build CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm pack --pack-destination dist
      - uses: actions/upload-artifact@v6
        with:
          name: mime-logger-tarball
          path: dist/mime-logger-*.tgz

  smoke:
    name: Smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: [16, 18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: mime-logger-tarball
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-save dist/mime-logger-*.tgz
      - run: node test/smoke/smoke-test.mjs
      - run: node test/smoke/smoke-test.cjs
